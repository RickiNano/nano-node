name: Code Sanitizers

on: [ push, pull_request, workflow_dispatch ]

jobs:
  linux_sanitizers:
    name: Linux [${{ matrix.SANITIZER.name }}] [${{ matrix.BACKEND }} | ${{ matrix.COMPILER }}] ${{ matrix.SANITIZER.ignore_errors && ' (Errors Ignored)' || '' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        BACKEND: [ lmdb, rocksdb ]
        COMPILER: [ clang ]
        SANITIZER:
          - { name: UBSAN, ignore_errors: false }
          - { name: ASAN, ignore_errors: false, leak_check: false }
          - { name: ASAN_INT, ignore_errors: true, leak_check: false }
          - { name: TSAN, ignore_errors: false }
          - { name: LEAK, ignore_errors: false, leak_check: true }
        exclude:
          # Bug when running with TSAN: "ThreadSanitizer: CHECK failed: sanitizer_deadlock_detector"
          - BACKEND: rocksdb
            SANITIZER: { name: TSAN }
    runs-on: ubuntu-24.04
    env:
      COMPILER: ${{ matrix.COMPILER }}
      BACKEND: ${{ matrix.BACKEND }}
      SANITIZER: ${{ matrix.SANITIZER.name }}
      IGNORE_ERRORS: ${{ matrix.SANITIZER.ignore_errors }}
      TEST_USE_ROCKSDB: ${{ matrix.BACKEND == 'rocksdb' && '1' || '0' }}
      DEADLINE_SCALE_FACTOR: ${{ matrix.BACKEND == 'rocksdb' && '2' || '1' }}
      ASAN_OPTIONS: log_exe_name=1:log_path=sanitizer_report:suppressions=../asan_suppressions:detect_leaks=${{ matrix.SANITIZER.leak_check && '1' || '0' }}
      TSAN_OPTIONS: log_exe_name=1:log_path=sanitizer_report:suppressions=../tsan_suppressions
      UBSAN_OPTIONS: log_exe_name=1:log_path=sanitizer_report:print_stacktrace=1
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: linux-sanitizers-${{ matrix.SANITIZER.name }}-${{ matrix.COMPILER }}
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache.log
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Prepare
        run: sudo -E ci/prepare/linux/prepare.sh

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: sccache environment diagnostics
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "base repo: ${{ github.repository }}"
          echo "is fork PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL:-<unset>}"
          echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-<unset>}"
          echo "ACTIONS_RUNTIME_TOKEN set: ${ACTIONS_RUNTIME_TOKEN:+yes}${ACTIONS_RUNTIME_TOKEN:-no}"
          sccache --version

      - name: Build Tests
        id: build
        run: ci/build-tests.sh

      - name: Build cache stats
        if: always()
        run: sccache --show-stats

      - name: sccache error log
        if: always()
        run: |
          if [ -f /tmp/sccache.log ]; then
            echo "=== sccache error log (last 500 lines) ==="
            tail -n 500 /tmp/sccache.log
          else
            echo "No sccache error log at /tmp/sccache.log"
          fi

      - name: Upload sccache log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sccache-log-linux-${{ matrix.SANITIZER.name }}-${{ matrix.BACKEND }}-${{ matrix.COMPILER }}
          path: /tmp/sccache.log
          if-no-files-found: ignore

      - name: Core Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        continue-on-error: true
        run: timeout -sKILL 45m ../ci/tests/run-core-tests.sh
        working-directory: build

      - name: RPC Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        continue-on-error: true
        run: timeout -sKILL 20m ../ci/tests/run-rpc-tests.sh
        working-directory: build

      - name: Reports
        if: steps.build.outcome == 'success' && (success() || failure())
        continue-on-error: ${{ env.IGNORE_ERRORS == 'true' }}
        run: ../ci/tests/show-sanitizer-reports.sh
        working-directory: build


  macos_sanitizers:
    name: macOS [${{ matrix.SANITIZER.name }}] [${{ matrix.BACKEND }} | ${{ matrix.COMPILER }}] ${{ matrix.SANITIZER.ignore_errors && ' (Errors Ignored)' || '' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        BACKEND: [ lmdb, rocksdb ]
        COMPILER: [ clang ]
        SANITIZER:
          - { name: UBSAN, ignore_errors: false }
          - { name: ASAN, ignore_errors: false }
          - { name: TSAN, ignore_errors: false }
    runs-on: macos-14
    env:
      COMPILER: ${{ matrix.COMPILER }}
      BACKEND: ${{ matrix.BACKEND }}
      SANITIZER: ${{ matrix.SANITIZER.name }}
      IGNORE_ERRORS: ${{ matrix.SANITIZER.ignore_errors }}
      TEST_USE_ROCKSDB: ${{ matrix.BACKEND == 'rocksdb' && '1' || '0' }}
      DEADLINE_SCALE_FACTOR: ${{ matrix.BACKEND == 'rocksdb' && '2' || '1' }}
      ASAN_OPTIONS: log_exe_name=1:log_path=sanitizer_report:suppressions=../asan_suppressions
      TSAN_OPTIONS: log_exe_name=1:log_path=sanitizer_report:suppressions=../tsan_suppressions
      UBSAN_OPTIONS: log_exe_name=1:log_path=sanitizer_report:print_stacktrace=1
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: macos-sanitizers-${{ matrix.SANITIZER.name }}-${{ matrix.COMPILER }}
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache.log
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/macos/prepare.sh

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: sccache environment diagnostics
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "base repo: ${{ github.repository }}"
          echo "is fork PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL:-<unset>}"
          echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-<unset>}"
          echo "ACTIONS_RUNTIME_TOKEN set: ${ACTIONS_RUNTIME_TOKEN:+yes}${ACTIONS_RUNTIME_TOKEN:-no}"
          sccache --version

      - name: Build Tests
        id: build
        run: ci/build-tests.sh

      - name: Build cache stats
        if: always()
        run: sccache --show-stats

      - name: sccache error log
        if: always()
        run: |
          if [ -f /tmp/sccache.log ]; then
            echo "=== sccache error log (last 500 lines) ==="
            tail -n 500 /tmp/sccache.log
          else
            echo "No sccache error log at /tmp/sccache.log"
          fi

      - name: Upload sccache log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sccache-log-macos-${{ matrix.SANITIZER.name }}-${{ matrix.BACKEND }}-${{ matrix.COMPILER }}
          path: /tmp/sccache.log
          if-no-files-found: ignore

      - name: Core Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        continue-on-error: true
        run: timeout -sKILL 45m ../ci/tests/run-core-tests.sh
        working-directory: build

      - name: RPC Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        continue-on-error: true
        run: timeout -sKILL 20m ../ci/tests/run-rpc-tests.sh
        working-directory: build

      - name: Reports
        if: steps.build.outcome == 'success' && (success() || failure())
        continue-on-error: ${{ env.IGNORE_ERRORS == 'true' }}
        run: ../ci/tests/show-sanitizer-reports.sh
        working-directory: build

