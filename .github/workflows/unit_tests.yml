name: Unit Tests

on: [push, pull_request]

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: submodule.fetchJobs
  GIT_CONFIG_VALUE_0: 8

jobs:
  macos_test:
    name: macOS [${{ matrix.BACKEND }}]
    strategy:
      fail-fast: false
      matrix:
        BACKEND: [lmdb, rocksdb]
        RELEASE:
          - ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      NANO_BACKEND: ${{ matrix.BACKEND }}
      BUILD_TYPE: ${{ matrix.RELEASE && 'RelWithDebInfo' || 'Debug' }}
      TEST_USE_ROCKSDB: ${{ matrix.BACKEND == 'rocksdb' && '1' || '0' }}
      DEADLINE_SCALE_FACTOR: ${{ matrix.BACKEND == 'rocksdb' && '2' || '1' }}
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: macos-${{ matrix.RELEASE }}
      # Only the develop branch populates the cache.
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/develop' && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_IDLE_TIMEOUT: "0"
    runs-on: macos-26
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/macos/prepare.sh

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Tests
        id: build
        run: ci/build-tests.sh

      - name: Build cache stats
        if: always()
        run: sccache --show-stats

      - name: Setup Core Dumps
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ci/tests/setup-core-dumps.sh

      - name: Core Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-core-tests.sh
        working-directory: build

      - name: RPC Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-rpc-tests.sh
        working-directory: build

      - name: System Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-system-tests.sh
        working-directory: build

  # The backend is only selected at test time, so each compiler is built once and the binaries are shared by the lmdb and rocksdb test jobs.
  linux_build:
    name: Linux build [${{ matrix.COMPILER }}]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        COMPILER: [gcc, clang]
        RELEASE:
          - ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    env:
      COMPILER: ${{ matrix.COMPILER }}
      BUILD_TYPE: ${{ matrix.RELEASE && 'RelWithDebInfo' || 'Debug' }}
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: linux-${{ matrix.COMPILER }}-${{ matrix.RELEASE }}
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_IDLE_TIMEOUT: "0"
      # sccache treats a throttled cache read as a miss and only reports it at warn level.
      SCCACHE_LOG: warn
      SCCACHE_ERROR_LOG: /tmp/sccache.log
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Prepare
        run: sudo -E ci/prepare/linux/prepare.sh

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Tests
        run: ci/build-tests.sh

      - name: Build cache stats
        if: always()
        run: |
          sccache --show-stats
          echo "Failed cache reads (counted as misses): $(grep -c 'Got unexpected error' "$SCCACHE_ERROR_LOG" || true)"

      # upload-artifact drops the executable bit, so the binaries are packed into a tar first
      - name: Package Binaries
        run: tar -cf binaries.tar -C build core_test rpc_test qt_test nano_node nano_rpc nano_wallet

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.COMPILER }}-binaries
          path: binaries.tar
          retention-days: 1
          if-no-files-found: error

  linux_test:
    name: Linux [${{ matrix.BACKEND }} | ${{ matrix.COMPILER }}]
    needs: linux_build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        BACKEND: [lmdb, rocksdb]
        COMPILER: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      COMPILER: ${{ matrix.COMPILER }}
      NANO_BACKEND: ${{ matrix.BACKEND }}
      TEST_USE_ROCKSDB: ${{ matrix.BACKEND == 'rocksdb' && '1' || '0' }}
      DEADLINE_SCALE_FACTOR: ${{ matrix.BACKEND == 'rocksdb' && '2' || '1' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare
        run: sudo -E ci/prepare/linux/prepare.sh

      - name: Download Binaries
        uses: actions/download-artifact@v6
        with:
          name: linux-${{ matrix.COMPILER }}-binaries

      - name: Unpack Binaries
        id: unpack
        run: mkdir -p build && tar -xf binaries.tar -C build

      - name: Setup Core Dumps
        if: steps.unpack.outcome == 'success' && (success() || failure())
        run: ci/tests/setup-core-dumps.sh

      - name: Core Tests
        if: steps.unpack.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-core-tests.sh
        working-directory: build

      - name: RPC Tests
        if: steps.unpack.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-rpc-tests.sh
        working-directory: build

      - name: System Tests
        if: steps.unpack.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-system-tests.sh
        working-directory: build

      - name: QT Tests
        if: steps.unpack.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-qt-tests.sh
        working-directory: build

  windows_test:
    name: Windows [${{ matrix.BACKEND }}]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        BACKEND: [lmdb, rocksdb]
        RELEASE:
          - ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2022
    env:
      NANO_BACKEND: ${{ matrix.BACKEND }}
      BUILD_TYPE: ${{ matrix.RELEASE && 'RelWithDebInfo' || 'Debug' }}
      TEST_USE_ROCKSDB: ${{ matrix.BACKEND == 'rocksdb' && '1' || '0' }}
      DEADLINE_SCALE_FACTOR: ${{ matrix.BACKEND == 'rocksdb' && '2' || '1' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/windows/prepare.ps1

      - name: Build Tests
        id: build
        run: ci/build-tests.sh
        shell: bash

      - name: Setup Core Dumps
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ci/tests/setup-core-dumps.sh
        shell: bash

      - name: Core Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-core-tests.sh
        working-directory: build
        shell: bash

      - name: RPC Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-rpc-tests.sh
        working-directory: build
        shell: bash

      - name: System Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ../ci/tests/run-system-tests.sh
        working-directory: build
        shell: bash
        continue-on-error: true # FIXME: Investigate why this fails on Windows

  docker_build:
    name: Docker [build]
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - name: Build Production Docker Image
        run: |
          docker build \
            -f docker/node/Dockerfile \
            -t nano-node:latest \
            .

  docker_test:
    name: Docker [${{ matrix.BACKEND }}]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        BACKEND: [lmdb, rocksdb]
    runs-on: ubuntu-24.04
    env:
      NANO_BACKEND: ${{ matrix.BACKEND }}
      TEST_USE_ROCKSDB: ${{ matrix.BACKEND == 'rocksdb' && '1' || '0' }}
      DEADLINE_SCALE_FACTOR: ${{ matrix.BACKEND == 'rocksdb' && '2' || '1' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - name: Build Docker Test Image
        id: build
        run: ci/build-docker-tests.sh

      - name: Core Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ci/tests/run-docker-tests.sh core

      - name: RPC Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ci/tests/run-docker-tests.sh rpc

      - name: System Tests
        if: steps.build.outcome == 'success' && (success() || failure())
        run: ci/tests/run-docker-tests.sh system